<title>GR26 · Feedback</title>
<script>
  // Send any stray path under a survey folder (e.g. from a short link) to the right survey
  (function () {
    var p = location.pathname;
    if (p.indexOf('/gr26-survey/coordinators') === 0) location.replace('/gr26-survey/coordinators/');
    else if (p.indexOf('/gr26-survey/team') === 0) location.replace('/gr26-survey/team/');
  })();
</script>
